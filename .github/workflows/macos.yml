name: macOS

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'benchmarks/results/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'benchmarks/results/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the benchmark also builds the previous search implementation
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Vendor/llama
            Vendor/llama.cpp
            Vendor/llama-build
          key: llama-macos-arm64-${{ hashFiles('scripts/build-llama.sh', 'scripts/llama.cpp-no-logits.patch') }}
      - name: Build, test and verify the native bundle
        run: scripts/check-mac.sh
      - name: Compare large-index search performance
        run: >-
          python3 scripts/compare-search.py --current "$GITHUB_SHA"
          --output build.noindex/search-profile
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-profile-macos-arm64
          path: build.noindex/search-profile/*.json
